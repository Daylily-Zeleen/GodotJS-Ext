# Publishing a release and uploading its assets are the two halves of one
# flow, so they live in one reusable workflow instead of two files that could
# drift apart. Callers pick how much of the flow to run:
#   mode=full        create the release, then attach the assets (release.yml)
#   mode=upload-only skip creation, attach assets to an existing release
#                    (upload_assets.yml, for re-uploading after a manual run)
name: Release
on:
  workflow_call:
    inputs:
      mode:
        description: "'full' creates the release and uploads assets; 'upload-only' only uploads."
        required: false
        default: full
        type: string
      version:
        description: "Release tag the assets are attached to, for example v1.0.1."
        required: true
        type: string
      run_id:
        description: "CI run id whose build artifacts are packaged."
        required: true
        type: string
      versions:
        description: "Godot API versions to publish (mode=full only)."
        required: false
        default: "4.6"
        type: string
      ref:
        description: "Commit to release from (mode=full only)."
        required: false
        default: main
        type: string

permissions:
  # actions: read is required to fetch the source run's build artifacts
  # (gh run download); contents: write to create the release and attach assets.
  actions: read
  contents: write

jobs:
  release:
    name: Create GitHub Release
    if: inputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: ./.github/actions/pnpm-install

      - name: Install dependencies
        run: pnpm install
        working-directory: scripts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm ci:publish ${{ inputs.versions }}
        working-directory: scripts

  # One job per published JS engine. The legs each package contains - and the
  # `.gdextension` files inside it - are derived from the build matrix by
  # misc/release/package.py, the same script the CI gate runs, so what is
  # shipped and what is gated can never drift apart. Legs are fetched by exact
  # artifact name (gh run download, not actions/download-artifact with a
  # pattern): a package's legs do not share a single suffix any more - qjs-ng
  # and web both ship wasm, and globbing "*-v8" is exactly how the browser
  # engine used to end up inside the v8 package.
  upload:
    name: Upload ${{ matrix.engine }} Assets
    needs: [release]
    if: always() && (inputs.mode == 'upload-only' || needs.release.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        engine: [v8, qjs-ng, jsc, node, web]
    runs-on: ubuntu-latest
    steps:
      # Check out the commit the packaged run was built from: the leg list comes
      # from that revision's ci.yml, so a mismatch here would plan against a
      # different matrix than the artifacts were produced by.
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@v7

      - name: Ensure PyYAML
        shell: bash
        run: |
          set -euo pipefail
          python -c "import yaml" 2>/dev/null || python -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Lookup release ID
        id: lookup
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: json
          script: |
            const { repo, owner } = context.repo;
            const release = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag: '${{ inputs.version }}',
            });
            return release.data.id;

      - name: Plan and download the ${{ matrix.engine }} legs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== ${{ matrix.engine }} package legs (derived from the build matrix) ==="
          python misc/release/package.py plan --engine ${{ matrix.engine }}
          python misc/release/package.py fetch \
            --engine ${{ matrix.engine }} \
            --run "${{ inputs.run_id }}" \
            --dir artifacts \
            --repo "${{ github.repository }}"

      - name: Assemble the ${{ matrix.engine }} package
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          python misc/release/package.py assemble \
            --engine ${{ matrix.engine }} \
            --artifacts artifacts \
            --out out | tee assemble.log
          # The packager is the authority on the asset name: it is derived from
          # the legs actually merged (engine + platforms), never hardcoded here.
          # Emit the line verbatim: `$GITHUB_OUTPUT` wants `key=value`, and
          # `cut -d= -f2-` alone produced a bare value that the runner rejected
          # with "Invalid format 'godotjs-ext-...'".
          grep '^PACKAGE_NAME=' assemble.log >> "$GITHUB_OUTPUT"

      - name: Upload ${{ matrix.engine }} Asset to GitHub Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: json
          script: |
            const FS = require('node:fs')
            const { repo, owner } = context.repo;
            const releaseId = ${{ steps.lookup.outputs.result }};
            const zipName = '${{ steps.assemble.outputs.PACKAGE_NAME }}.zip';
            const zipPath = `${process.env.GITHUB_WORKSPACE}/out/${zipName}`;
            return await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: releaseId,
              name: zipName,
              data: FS.readFileSync(zipPath)
            });
