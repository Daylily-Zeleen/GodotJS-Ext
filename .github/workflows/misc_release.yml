name: Release
on:
  workflow_call:
    inputs:
      versions:
        required: true
        type: string
      ref:
        description: "Commit to release"
        required: false
        default: main
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.publish_release.outputs.id }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: ./.github/actions/pnpm-install

      - name: Install dependencies
        run: pnpm install
        working-directory: scripts

      - name: Publish release
        id: publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm ci:publish ${{ inputs.versions }}
        working-directory: scripts
