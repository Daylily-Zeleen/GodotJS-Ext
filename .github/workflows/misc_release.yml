# Publishing a release and uploading its assets are the two halves of one
# flow, so they live in one reusable workflow instead of two files that could
# drift apart. Callers pick how much of the flow to run:
#   mode=full        create the release, then attach the assets (release.yml)
#   mode=upload-only skip creation, attach assets to an existing release
#                    (upload_assets.yml, for re-uploading after a manual run)
name: Release
on:
  workflow_call:
    inputs:
      mode:
        description: "'full' creates the release and uploads assets; 'upload-only' only uploads."
        required: false
        default: full
        type: string
      version:
        description: "Release tag the assets are attached to, for example v1.0.1."
        required: true
        type: string
      run_id:
        description: "CI run id whose build artifacts are packaged."
        required: true
        type: string
      versions:
        description: "Godot API versions to publish (mode=full only)."
        required: false
        default: "4.6"
        type: string
      ref:
        description: "Commit to release from (mode=full only)."
        required: false
        default: main
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    if: inputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: ./.github/actions/pnpm-install

      - name: Install dependencies
        run: pnpm install
        working-directory: scripts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm ci:publish ${{ inputs.versions }}
        working-directory: scripts

  upload-v8:
    name: Upload V8 Runtime Assets
    needs: [release]
    if: always() && (inputs.mode == 'upload-only' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Lookup release ID
        id: lookup
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: json
          script: |
            const { repo, owner } = context.repo;
            const release = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag: '${{ inputs.version }}',
            });
            return release.data.id;

      - name: Download V8 artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts-v8
          pattern: "*-v8"
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package V8 addon
        shell: bash
        run: |
          ADDON_DIR="godotjs-ext-v8-windows-linux-macos"
          mkdir -p "$ADDON_DIR/bin"

          for artifact_dir in artifacts-v8/*/; do
            if [ -d "$artifact_dir" ] && [ -n "$(ls -A "$artifact_dir")" ]; then
              cp -r "$artifact_dir"* "$ADDON_DIR/bin/" 2>/dev/null || true
            fi
          done

          cp -v project/addons/godotjs-ext.daylily-zeleen/godotjs-ext.gdextension "$ADDON_DIR/" 2>/dev/null || true

          echo "=== V8 Addon contents ==="
          find "$ADDON_DIR" -type f

          zip -r "${ADDON_DIR}.zip" "$ADDON_DIR"

      - name: Upload V8 Asset to GitHub Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: json
          script: |
            const FS = require('node:fs')
            const { repo, owner } = context.repo;
            const releaseId = ${{ steps.lookup.outputs.result }};
            const zipName = 'godotjs-ext-v8-windows-linux-macos.zip';
            const zipPath = `${process.env.GITHUB_WORKSPACE}/${zipName}`;
            return await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: releaseId,
              name: zipName,
              data: FS.readFileSync(zipPath)
            });

  upload-qjs-ng:
    name: Upload QuickJS-NG Runtime Assets
    needs: [release]
    if: always() && (inputs.mode == 'upload-only' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Lookup release ID
        id: lookup
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: json
          script: |
            const { repo, owner } = context.repo;
            const release = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag: '${{ inputs.version }}',
            });
            return release.data.id;

      - name: Download QJS-NG artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts-qjs-ng
          pattern: "*-qjs-ng"
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package QJS-NG addon
        shell: bash
        run: |
          ADDON_DIR="godotjs-ext-qjs-ng-windows-linux-macos"
          mkdir -p "$ADDON_DIR/bin"

          for artifact_dir in artifacts-qjs-ng/*/; do
            if [ -d "$artifact_dir" ] && [ -n "$(ls -A "$artifact_dir")" ]; then
              cp -r "$artifact_dir"* "$ADDON_DIR/bin/" 2>/dev/null || true
            fi
          done

          cp -v project/addons/godotjs-ext.daylily-zeleen/godotjs-ext.gdextension "$ADDON_DIR/" 2>/dev/null || true

          echo "=== QJS-NG Addon contents ==="
          find "$ADDON_DIR" -type f

          zip -r "${ADDON_DIR}.zip" "$ADDON_DIR"

      - name: Upload QJS-NG Asset to GitHub Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: json
          script: |
            const FS = require('node:fs')
            const { repo, owner } = context.repo;
            const releaseId = ${{ steps.lookup.outputs.result }};
            const zipName = 'godotjs-ext-qjs-ng-windows-linux-macos.zip';
            const zipPath = `${process.env.GITHUB_WORKSPACE}/${zipName}`;
            return await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: releaseId,
              name: zipName,
              data: FS.readFileSync(zipPath)
            });
