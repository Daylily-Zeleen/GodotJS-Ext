name: Publish Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  should-publish:
    name: Check release condition
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.should_publish.outputs.publish }}
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: ./.github/actions/pnpm-install

      - name: Install dependencies
        run: pnpm install
        working-directory: scripts

      - name: Check whether to publish
        id: should_publish
        shell: bash
        working-directory: scripts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          should_publish="$(pnpm run ci:should-publish | tail -n 1)"
          echo "ci:should-publish=${should_publish}"
          if [ "${should_publish}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Create GitHub Release
    needs: should-publish
    if: needs.should-publish.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/misc_release.yml
    with:
      versions: '4.6'
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
