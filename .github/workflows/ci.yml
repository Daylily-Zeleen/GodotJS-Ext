name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  environment:
    name: Set Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: ./.github/actions/pnpm-install

      - name: Build JS runtime
        run: pnpm build
        shell: bash
        working-directory: scripts

      - name: Upload scripts/out
        uses: actions/upload-artifact@v4
        with:
          name: scripts-out
          path: ${{github.workspace}}/scripts/out
          retention-days: 1


  build:
    name: Build (${{ matrix.platform }}, ${{ matrix.arch }}, ${{ matrix.target }}, ${{ matrix.engine }})
    needs: environment
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            arch: x86_64
            target: editor
            engine: v8
          - platform: windows
            os: windows-latest
            arch: x86_64
            target: editor
            engine: qjs-ng
          - platform: linux
            os: ubuntu-22.04
            arch: x86_64
            target: editor
            engine: v8
          - platform: linux
            os: ubuntu-22.04
            arch: x86_64
            target: editor
            engine: qjs-ng
          # Linux arm64 builds (cross-compiled on x86_64 runner with
          # gcc-aarch64-linux-gnu; native arm64 runners are too scarce)
          - platform: linux
            os: ubuntu-22.04
            arch: arm64
            target: editor
            engine: v8
          - platform: linux
            os: ubuntu-22.04
            arch: arm64
            target: editor
            engine: qjs-ng
          # macOS builds.
          # - qjs-ng: universal (single build covers arm64 + x86_64, avoiding
          #   the deprecated/slow macos-13 x86_64 runners)
          # - v8: arm64 only (the v8 prebuilt has no universal variant, see
          #   SConstruct's explicit rejection of macos+universal+v8)
          - platform: macos
            os: macos-latest
            arch: arm64
            target: editor
            engine: v8
          - platform: macos
            os: macos-latest
            arch: universal
            target: editor
            engine: qjs-ng
          # iOS builds (device + simulator -> xcframework)
          - platform: ios
            os: macos-latest
            arch: arm64
            target: template_release
            engine: v8
          - platform: ios
            os: macos-latest
            arch: arm64
            target: template_release
            engine: qjs-ng
          - platform: ios
            os: macos-latest
            arch: arm64
            target: template_release
            engine: jsc
          # Android platform (arm64, x86_64)
          - platform: android
            os: ubuntu-22.04
            arch: arm64
            target: template_release
            engine: v8
          - platform: android
            os: ubuntu-22.04
            arch: arm64
            target: template_release
            engine: qjs-ng
          - platform: android
            os: ubuntu-22.04
            arch: x86_64
            target: template_release
            engine: v8
          - platform: android
            os: ubuntu-22.04
            arch: x86_64
            target: template_release
            engine: qjs-ng
          # Web platform (wasm32) - with threads
          - platform: web
            os: ubuntu-22.04
            arch: wasm32
            target: template_release
            engine: v8
            threads: true
          - platform: web
            os: ubuntu-22.04
            arch: wasm32
            target: template_release
            engine: qjs-ng
            threads: true
          # Web platform (wasm32) - without threads
          - platform: web
            os: ubuntu-22.04
            arch: wasm32
            target: template_release
            engine: v8
            threads: false
          - platform: web
            os: ubuntu-22.04
            arch: wasm32
            target: template_release
            engine: qjs-ng
            threads: false
          # Node engine (Windows, Linux, macOS)
          - platform: windows
            os: windows-latest
            arch: x86_64
            target: editor
            engine: node
          # NOTE: node builds on macos/linux are temporarily disabled:
          # libnode.a lacks the typeinfo symbols of v8::Value{Serializer,Deserializer}::Delegate,
          # which our delegate subclasses reference (see 低优先级.md).
          # - platform: linux
          #   os: ubuntu-22.04
          #   arch: x86_64
          #   target: editor
          #   engine: node
          # - platform: macos
          #   os: macos-latest
          #   arch: arm64
          #   target: editor
          #   engine: node
          # JavaScriptCore engine (macOS, iOS only)
          - platform: macos
            os: macos-latest
            arch: arm64
            target: editor
            engine: jsc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      - name: Download JS runtime
        uses: actions/download-artifact@v4
        with:
          name: scripts-out
          path: scripts/out

      # NOTE: SCons cache is enabled on non-Windows platforms only. MSVC's /Zi
      # emits a shared vc140.pdb that is not part of the cached .obj files, so
      # cache hits produce LNK4099 warnings which fail the build due to /WX.
      # GCC/Clang embed debug info per object file, so their caches are safe.
      - name: Restore V8 dependency cache
        if: matrix.engine == 'v8'
        uses: actions/cache@v4
        with:
          path: third/v8
          key: v8-dependency-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('SConstruct') }}

      - name: Restore Node dependency cache
        if: matrix.engine == 'node'
        uses: actions/cache@v4
        with:
          path: third/node
          key: node-dependency-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('SConstruct') }}

      - name: Restore SCons cache
        if: matrix.platform != 'windows'
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.engine }}${{ matrix.platform == 'web' && format('-threads-{0}', matrix.threads) || '' }}-${{ hashFiles('SConstruct', 'src/**', 'third/godot-cpp/**') }}
          restore-keys: |
            scons-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.engine }}${{ matrix.platform == 'web' && format('-threads-{0}', matrix.threads) || '' }}-
            scons-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-
            scons-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Setup JDK 17 for Android
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        if: matrix.platform == 'android'
        run: |
          # Install NDK 28.1.13356709 (default version in godot-cpp)
          sdkmanager "ndk;28.1.13356709"
          # Set ANDROID_HOME environment variable
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Setup Emscripten
        if: matrix.platform == 'web'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.39
          actions-cache-folder: 'emsdk-cache'

      - name: Build GDExtension
        shell: bash
        run: |
          # SCons cache is enabled on non-Windows platforms only (see restore step above).
          if [ "${{ matrix.platform }}" != "windows" ]; then
            export SCONS_CACHE="$GITHUB_WORKSPACE/.scons-cache"
          fi
          
          # Set engine flag based on matrix.engine
          if [ "${{ matrix.engine }}" == "qjs-ng" ]; then
            engine_flag="use_quickjs_ng=yes"
          elif [ "${{ matrix.engine }}" == "node" ]; then
            engine_flag="use_node=yes"
          elif [ "${{ matrix.engine }}" == "jsc" ]; then
            engine_flag="use_jsc=yes"
          else
            engine_flag=""
          fi
          
          # Set threads flag for web platform
          if [ "${{ matrix.platform }}" == "web" ]; then
            if [ "${{ matrix.threads }}" == "false" ]; then
              threads_flag="threads=no"
            else
              threads_flag="threads=yes"
            fi
          else
            threads_flag=""
          fi
          
          # Determine parallel job count (cross-platform)
          if command -v nproc >/dev/null 2>&1; then
            NPROC=$(nproc)
          elif command -v sysctl >/dev/null 2>&1; then
            NPROC=$(sysctl -n hw.ncpu)
          else
            NPROC=2
          fi
          
          # Linux arm64: cross-compile with the aarch64 toolchain (the native
          # arm64 runners are too scarce). godot-cpp's linux.py appends
          # -march=armv8-a which only the aarch64 compiler understands.
          cross_flags=""
          if [ "${{ matrix.platform }}" == "linux" ] && [ "${{ matrix.arch }}" == "arm64" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            cross_flags="CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++"
          fi
          
          # iOS, Android, and Web don't support tests or dev_build
          if [ "${{ matrix.platform }}" == "ios" ] || [ "${{ matrix.platform }}" == "android" ] || [ "${{ matrix.platform }}" == "web" ]; then
            scons platform=${{ matrix.platform }} target=${{ matrix.target }} arch=${{ matrix.arch }} compiledb=yes debug_symbols=yes verbose=yes $engine_flag $threads_flag $cross_flags -j$NPROC
          else
            scons platform=${{ matrix.platform }} target=${{ matrix.target }} arch=${{ matrix.arch }} compiledb=yes debug_symbols=yes dev_build=yes tests=yes verbose=yes $engine_flag $threads_flag $cross_flags -j$NPROC
          fi
          
          # iOS: Build simulator version and generate xcframework.
          # NOTE: v8 has no iOS-simulator prebuilt, so only quickjs-ng/jsc
          # produce an xcframework; v8 produces the device dylib alone.
          if [ "${{ matrix.platform }}" == "ios" ]; then
            if [ "${{ matrix.engine }}" != "v8" ]; then
              echo "Building iOS simulator version..."
              scons platform=${{ matrix.platform }} target=${{ matrix.target }} arch=${{ matrix.arch }} compiledb=yes debug_symbols=yes verbose=yes $engine_flag ios_simulator=yes -j$NPROC
              echo "Generating xcframework..."
              # The xcframework is automatically generated by SConstruct when both builds are present
            else
              echo "Skipping iOS simulator build for v8 (no simulator prebuilt available)"
            fi
          fi

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp -r bin/* artifact/ 2>/dev/null || true

      - name: Copy LICENSE to artifact
        shell: bash
        run: |
          mkdir -p artifact/addons/godotjs-ext.daylily-zeleen
          cp LICENSE artifact/addons/godotjs-ext.daylily-zeleen/

      - name: Upload GDExtension artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}-${{ matrix.engine }}${{ matrix.platform == 'web' && matrix.threads == false && '-nothreads' || '' }}
          path: artifact/
          retention-days: 1

  test:
    name: Test (${{ matrix.runtime }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # host-v8 / host-qjs run on Linux (artifacts built natively there)
          - runtime: host-v8
            os: ubuntu-22.04
            artifact: linux-editor-x86_64-v8
            godot_asset: Godot_v4.7.1-stable_linux.x86_64.zip
          - runtime: host-qjs
            os: ubuntu-22.04
            artifact: linux-editor-x86_64-qjs-ng
            godot_asset: Godot_v4.7.1-stable_linux.x86_64.zip
          # host-node runs on Windows: libnode is only linked on Windows
          # (linux/macos builds were dropped due to missing libnode symbols)
          - runtime: host-node
            os: windows-latest
            artifact: windows-editor-x86_64-node
            godot_asset: Godot_v4.7.1-stable_win64.exe.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: ./.github/actions/pnpm-install

      - name: Build JS runtime
        run: pnpm build
        shell: bash
        working-directory: scripts

      - name: Install gdb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gdb

      # A crashing Godot process on Windows can pop up the Windows Error
      # Reporting dialog, which blocks the runner forever. Disable its UI.
      - name: Disable Windows Error Reporting UI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting' -Name DontShowUI -Value 1 -Type DWord

      - name: Download GDExtension artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: runtime-artifacts

      - name: Download Godot (Linux)
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot
          version: tags/4.7.1-stable
          file: ${{ matrix.godot_asset }}
          target: godot/godot.zip

      - name: Extract Godot
        shell: bash
        run: |
          mkdir -p tests/bin
          if [ "$RUNNER_OS" == "Windows" ]; then
            powershell -NoProfile -Command "Expand-Archive -Path godot/godot.zip -DestinationPath tests/bin -Force"
          else
            unzip -o godot/godot.zip -d tests/bin/
          fi
          chmod +x tests/bin/Godot* 2>/dev/null || true
          GODOT_BIN=$(find tests/bin -maxdepth 1 -name 'Godot*' -type f | head -1)
          if [ "$RUNNER_OS" == "Windows" ]; then
            # Windows requires the .exe suffix for spawnSync to launch it
            cp "$GODOT_BIN" "tests/bin/godot-${{ matrix.runtime }}.exe"
          else
            cp "$GODOT_BIN" "tests/bin/godot-${{ matrix.runtime }}"
          fi
          echo "GODOT=$GITHUB_WORKSPACE/$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Setup test project
        shell: bash
        run: |
          mkdir -p project/addons/godotjs-ext.daylily-zeleen/bin
          cp -r runtime-artifacts/. project/addons/godotjs-ext.daylily-zeleen/bin/

      # NOTE: gen:types (gen-godotjs-types.mts) requires a fully running Godot editor
      # with pre-generated API dump data, which creates a circular dependency in CI
      # (API dump generation itself needs the extension loaded). CI tests only need
      # tsc compilation — skip gen:types and use tsc --noCheck instead.

      - name: Build TypeScript test files
        shell: bash
        run: |
          pnpm install
          pnpm exec tsc --noCheck
        working-directory: project

      - name: Generate API data
        timeout-minutes: 15
        shell: bash
        # The C++ unit tests (and api_tool) need the .api_dumping data, which
        # is normally generated by the editor. In a fresh CI checkout it does
        # not exist, so generate it here:
        #   1. dump the extension API (with docs) into project/extension_api.json
        #   2. convert it into project/.godot/.api_dumping/*.capi via the
        #      --godotjs-api-generate extension command.
        # NOTE: On Godot 4.7.1 both steps can crash during editor shutdown/reimport
        # (exit non-zero) even though the data is written correctly before that;
        # tolerate the crash and verify the generated files instead. The C++
        # unit test step below also depends on this data, so a genuinely
        # incomplete generation would fail there.
        run: |
          "$GODOT" --headless --editor --path project --dump-extension-api-with-docs || true
          test -f project/extension_api.json
          # NOTE: the editor may crash during its shutdown phase after the data has
          # been written (Godot 4.7.1 + extension teardown - tracked separately);
          # success is judged by the presence of the generated store below.
          # The first-generation pipeline is non-deterministically hit by a
          # teardown/reimport SIGSEGV (tracked separately). A rerun on wiped
          # caches usually completes cleanly, so retry a few times and only
          # fail when the store is still missing afterwards.
          ok=0
          for attempt in 1 2 3; do
            if "$GODOT" --headless --editor --path project --godotjs-api-generate extension_api.json --quit; then
              ok=1
            fi
            if test -f project/.godot/.api_dumping/header.capi; then
              ok=1
              break
            fi
            echo "attempt $attempt did not produce the api store, wiping caches and retrying..."
            rm -rf project/.godot
            pnpm -C project exec tsc --noCheck
            "$GODOT" --headless --editor --path project --dump-extension-api-with-docs || true
            test -f project/extension_api.json
          done
          test -f project/.godot/.api_dumping/header.capi || { echo "api store missing after retries"; exit 1; }

      # Diagnostic: rerun the exact first-time generation scenario under gdb
      # to capture a symbolized backtrace of the teardown SIGSEGV. Never
      # fails the job (continue-on-error), the backtrace lands in the log.
      - name: Debug first-generation teardown crash (diagnostic)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          # Wipe the WHOLE .godot cache dir (not just api_dumping): leftover
          # import caches / runtime install markers from a previous successful
          # generation change the startup+teardown path and mask the crash.
          rm -rf project/.godot
          "$GODOT" --headless --editor --path project --dump-extension-api-with-docs || true
          test -f project/extension_api.json
          gdb -batch -ex run -ex "bt full" --args "$GODOT" --headless --editor --path project --godotjs-api-generate extension_api.json --quit || true

      - name: Run C++ unit tests
        shell: bash
        # C++ unit tests run via --jsb-run-tests and exit on their own;
        # they are independent from the TypeScript integration tests below.
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            "$GODOT" --headless --path project --jsb-run-tests
          else
            timeout 120 "$GODOT" --headless --path project --jsb-run-tests
          fi

      - name: Run TypeScript integration tests
        shell: bash
        run: |
          node scripts/test/run-runtime-matrix.mts --runtimes ${{ matrix.runtime }} --skip-builds

  changesets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    name: Changesets
    uses: ./.github/workflows/misc_changesets.yml

  # Publishing and asset upload run in separate workflow_run workflows after
  # this CI workflow completes. Keeping them out of this dependency graph means
  # manually rerunning a failed matrix job can complete CI without leaving
  # release jobs permanently skipped in the original run.
  # SCons cache keys embed a hashFiles(...) fingerprint, so every source change
  # creates a NEW cache entry and stale ones accumulate until they exhaust the
  # Actions cache quota (10 GB). Keep only the most recent cache per
  # (OS, platform, engine) combo on the current branch.
  cleanup-caches:
    name: Cleanup Old Caches
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # gh cache list --ref resolves the ref via git, so a checkout is required.
      - uses: actions/checkout@v6

      - name: Delete stale SCons caches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ github.head_ref || github.ref_name }}"
          ids=$(gh cache list --ref "$ref" --key scons- --limit 100 \
            --json id,key,createdAt -q '
              sort_by(.key)
              | group_by(.key | split("-")[0:4] | join("-"))
              | .[]
              | sort_by(.createdAt)
              | reverse
              | .[1:]
              | .[].id
            ')
          if [ -z "$ids" ]; then
            echo "No stale SCons caches to delete (ref=$ref)."
            exit 0
          fi
          for id in $ids; do
            echo "Deleting cache $id"
            gh cache delete "$id"
          done
          echo "Done."
