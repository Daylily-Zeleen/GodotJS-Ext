name: CI

on:
  pull_request:
  push:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  environment:
    name: Set Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: ./.github/actions/pnpm-install

      - name: Build JS runtime
        run: pnpm build
        shell: bash
        working-directory: scripts

      - name: Upload scripts/out
        uses: actions/upload-artifact@v4
        with:
          name: scripts-out
          path: ${{github.workspace}}/scripts/out
          retention-days: 10

  build:
    name: Build (${{ matrix.platform }}, ${{ matrix.engine }})
    needs: environment
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            engine: v8
          - platform: windows
            os: windows-latest
            engine: qjs-ng
          - platform: linux
            os: ubuntu-22.04
            engine: v8
          - platform: linux
            os: ubuntu-22.04
            engine: qjs-ng
          - platform: macos
            os: macos-latest
            engine: v8
          - platform: macos
            os: macos-latest
            engine: qjs-ng
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      - name: Download JS runtime
        uses: actions/download-artifact@v4
        with:
          name: scripts-out
          path: scripts/out

      # NOTE: SCons cache is enabled on non-Windows platforms only. MSVC's /Zi
      # emits a shared vc140.pdb that is not part of the cached .obj files, so
      # cache hits produce LNK4099 warnings which fail the build due to /WX.
      # GCC/Clang embed debug info per object file, so their caches are safe.
      - name: Restore SCons cache
        if: matrix.platform != 'windows'
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.engine }}-${{ hashFiles('SConstruct', 'src/**', 'third/godot-cpp/**') }}
          restore-keys: |
            scons-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.engine }}-
            scons-${{ runner.os }}-${{ matrix.platform }}-

      - name: Build GDExtension
        shell: bash
        run: |
          # SCons cache is enabled on non-Windows platforms only (see restore step above).
          if [ "${{ matrix.platform }}" != "windows" ]; then
            export SCONS_CACHE="$GITHUB_WORKSPACE/.scons-cache"
          fi
          engine_flag="${{ matrix.engine == 'qjs-ng' && 'use_quickjs_ng=yes' || '' }}"
          arch_flag="${{ matrix.platform == 'macos' && 'arch=arm64' || '' }}"
          scons platform=${{ matrix.platform }} target=editor compiledb=yes debug_symbols=yes dev_build=yes tests=yes verbose=yes $engine_flag $arch_flag -j$(nproc || sysctl -n hw.ncpu)

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp -r bin/* artifact/ 2>/dev/null || true

      - name: Upload GDExtension artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-editor-${{ matrix.engine }}
          path: artifact/
          retention-days: 10

  test:
    name: Test (${{ matrix.runtime }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runtime: [host-v8, host-qjs]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: ./.github/actions/pnpm-install

      - name: Build JS runtime
        run: pnpm build
        shell: bash
        working-directory: scripts

      - name: Install gdb
        run: sudo apt-get update && sudo apt-get install -y gdb

      - name: Download GDExtension artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-editor-${{ matrix.runtime == 'host-v8' && 'v8' || 'qjs-ng' }}
          path: runtime-artifacts

      - name: Download Godot (Linux)
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot
          version: tags/4.7.1-stable
          file: Godot_v4.7.1-stable_linux.x86_64.zip
          target: godot/godot.zip

      - name: Extract Godot
        run: |
          mkdir -p tests/bin
          unzip -o godot/godot.zip -d tests/bin/
          chmod +x tests/bin/Godot*
          GODOT_BIN=$(find tests/bin -maxdepth 1 -name 'Godot*' -type f | head -1)
          cp "$GODOT_BIN" tests/bin/godot-host-v8
          cp "$GODOT_BIN" tests/bin/godot-host-qjs
          echo "GODOT=$GITHUB_WORKSPACE/$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Setup test project
        shell: bash
        run: |
          mkdir -p project/addons/godotjs-ext.daylily-zeleen/bin
          cp -r runtime-artifacts/. project/addons/godotjs-ext.daylily-zeleen/bin/

      # NOTE: gen:types (gen-godotjs-types.mts) requires a fully running Godot editor
      # with pre-generated API dump data, which creates a circular dependency in CI
      # (API dump generation itself needs the extension loaded). CI tests only need
      # tsc compilation — skip gen:types and use tsc --noCheck instead.

      - name: Build TypeScript test files
        shell: bash
        run: |
          pnpm install
          pnpm exec tsc --noCheck
        working-directory: project

      - name: Generate API data
        shell: bash
        # The C++ unit tests (and api_tool) need the .api_dumping data, which
        # is normally generated by the editor. In a fresh CI checkout it does
        # not exist, so generate it here:
        #   1. dump the extension API (with docs) into project/extension_api.json
        #   2. convert it into project/.godot/.api_dumping/*.capi via the
        #      --godotjs-api-generate extension command.
        # NOTE: On Godot 4.7.1 both steps can crash during editor shutdown/reimport
        # (exit non-zero) even though the data is written correctly before that;
        # tolerate the crash and verify the generated files instead. The C++
        # unit test step below also depends on this data, so a genuinely
        # incomplete generation would fail there.
        run: |
          tests/bin/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path project --dump-extension-api-with-docs || true
          test -f project/extension_api.json
          tests/bin/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path project --godotjs-api-generate extension_api.json --quit || true
          test -f project/.godot/.api_dumping/header.capi

      - name: Run C++ unit tests
        shell: bash
        # C++ unit tests run via --jsb-run-tests and exit on their own;
        # they are independent from the TypeScript integration tests below.
        run: |
          timeout 120 tests/bin/Godot_v4.7.1-stable_linux.x86_64 --headless --path project --jsb-run-tests

      - name: Run TypeScript integration tests
        shell: bash
        run: |
          node scripts/test/run-runtime-matrix.mts --runtimes ${{ matrix.runtime }} --skip-builds
        continue-on-error: true

  changesets:
    if: false
    permissions:
      contents: write
      pull-requests: write
    name: Changesets
    uses: ./.github/workflows/misc_changesets.yml

  release:
    name: Release
    needs: [build, changesets]
    if: needs.changesets.outputs.publish == 'true'
    permissions:
      contents: write
    with:
      versions: '4.6'
    uses: ./.github/workflows/misc_release.yml
    secrets: inherit

  upload-assets:
    name: Upload Assets
    needs: [build, release]
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: ./.github/workflows/misc_upload_assets.yml
    with:
      version: ${{ github.event.release.tag_name }}
    secrets: inherit
