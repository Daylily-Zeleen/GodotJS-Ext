name: CI

on:
  pull_request:
  push:
    branches:
      - "main"
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}
  cancel-in-progress: true

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache/

jobs:
  environment:
    name: Set Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: ./.github/actions/pnpm-install

      - name: Build JS runtime
        run: pnpm build
        shell: bash
        working-directory: scripts

      - name: Upload scripts/out
        uses: actions/upload-artifact@v4
        with:
          name: scripts-out
          path: ${{github.workspace}}/scripts/out
          retention-days: 10

  build:
    name: Build (${{ matrix.platform }}, ${{ matrix.engine }})
    needs: environment
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            engine: v8
          - platform: windows
            os: windows-latest
            engine: qjs-ng
          - platform: linux
            os: ubuntu-22.04
            engine: v8
          - platform: linux
            os: ubuntu-22.04
            engine: qjs-ng
          - platform: macos
            os: macos-latest
            engine: v8
          - platform: macos
            os: macos-latest
            engine: qjs-ng
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      - name: Download JS runtime
        uses: actions/download-artifact@v4
        with:
          name: scripts-out
          path: scripts/out

      - name: Restore scons cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-${{ matrix.platform }}-${{ matrix.engine }}-${{ hashFiles('SConstruct', 'src/**', 'third/**') }}
          restore-keys: |
            scons-${{ matrix.platform }}-${{ matrix.engine }}-
            scons-${{ matrix.platform }}-

      - name: Build GDExtension
        shell: bash
        run: |
          engine_flag="${{ matrix.engine == 'qjs-ng' && 'use_quickjs_ng=yes' || '' }}"
          scons platform=${{ matrix.platform }} target=editor compiledb=yes debug_symbols=yes dev_build=yes tests=yes $engine_flag -j$(nproc || sysctl -n hw.ncpu)

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp -r bin/* artifact/ 2>/dev/null || true

      - name: Upload GDExtension artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-editor-${{ matrix.engine }}
          path: artifact/
          retention-days: 10

  test:
    name: Test (${{ matrix.runtime }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runtime: [host-v8, host-qjs]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: ./.github/actions/pnpm-install

      - name: Build JS runtime
        run: pnpm build
        shell: bash
        working-directory: scripts

      - name: Download GDExtension artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-editor-${{ matrix.runtime == 'host-v8' && 'v8' || 'qjs-ng' }}
          path: runtime-artifacts

      - name: Download Godot (Linux)
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot
          version: tags/4.7-stable
          file: Godot_v4.7-stable_linux.x86_64.zip
          target: godot/godot.zip

      - name: Extract Godot
        run: |
          unzip -o godot/godot.zip -d tests/bin/
          chmod +x tests/bin/Godot*

      - name: Setup test project
        shell: bash
        run: |
          mkdir -p project/addons
          cp -r runtime-artifacts project/addons/godotjs-ext.daylily-zeleen

      - name: Build TypeScript test files
        shell: bash
        run: |
          cd project
          pnpm install
          pnpm build
        working-directory: project

      - name: Run C++ unit tests
        shell: bash
        run: |
          tests/bin/Godot_v4.7-stable_linux.x86_64 --headless --path project --jsb-run-tests

      - name: Run TypeScript integration tests
        shell: bash
        run: |
          pnpm test -- --runtimes ${{ matrix.runtime }} --skip-builds
        working-directory: project
        continue-on-error: true

  changesets:
    if: github.event_name != 'release' && github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    name: Changesets
    uses: ./.github/workflows/misc_changesets.yml

  release:
    name: Release
    needs: [build, changesets]
    if: needs.changesets.outputs.publish == 'true'
    permissions:
      contents: write
    with:
      versions: '4.6'
    uses: ./.github/workflows/misc_release.yml
    secrets: inherit

  upload-assets:
    name: Upload Assets
    needs: [build, release]
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: ./.github/workflows/misc_upload_assets.yml
    with:
      version: ${{ github.event.release.tag_name }}
    secrets: inherit
