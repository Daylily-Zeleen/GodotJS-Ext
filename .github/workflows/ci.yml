name: CI

env:
  # Dependency versions - aligned with godot-cpp
  EM_VERSION: 4.0.11
  NDK_VERSION: r28b
  # Tool/environment versions - aligned with godot-cpp
  PYTHON_VERSION: "3.x"
  PNPM_VERSION: "10.11.0"
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  # MUST be >= 4.10.1: that is the first SCons release whose MSVC detection
  # knows the VS 2022+/"14.5" toolset (VS 2026, product major 18). The
  # `windows-latest` runner image is now windows-2025-vs2026, which ships
  # ONLY VS 2026; an older SCons sees no MSVC at all (msvc.exists() -> False),
  # so godot-cpp's tools/windows.py silently falls back to MinGW and the
  # build dies on MSVC-only flags (/Z7, /Fd...) that g++ reads as file names.
  SCONS_VERSION: "4.11.1"
  # MUST be >= 14.1.0: older Chocolatey packages ship binutils 2.39, which
  # overflows the COFF string table on the static-binding dispatch TU
  # ("string table overflow at offset 10000xxx"). See the mingw-version input.
  MINGW_VERSION: "14.2.0"
  GODOT_VERSION: "tags/4.7.1-stable"
  GODOT_ASSET_LINUX: "Godot_v4.7.1-stable_linux.x86_64.zip"
  GODOT_ASSET_WINDOWS: "Godot_v4.7.1-stable_win64.exe.zip"
  GODOT_ASSET_MACOS: "Godot_v4.7.1-stable_macos.universal.zip"
on:
  workflow_dispatch:
    inputs:
      # Fast path for dependency work: pull the per-platform artifacts from a
      # GodotJS-Dependencies CI run instead of waiting for a full release.
      # Set deps_run to that run's id and deps_engines to the engines to verify.
      deps_run:
        description: 'GodotJS-Dependencies workflow run id to consume artifacts from (empty = use releases)'
        type: string
        required: false
        default: ''
      deps_engines:
        description: 'Engines to pull from that run, e.g. "node" or "v8,node" (empty = all engines the run provides)'
        type: string
        required: false
        default: ''
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  environment:
    name: Set Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: ./.github/actions/pnpm-install
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Build JS runtime
        run: pnpm build
        shell: bash
        working-directory: scripts

      - name: Upload scripts/out
        uses: actions/upload-artifact@v7
        with:
          name: scripts-out
          path: ${{github.workspace}}/scripts/out
          retention-days: 1

  # Static-vs-dynamic binding benchmark (manual trigger only).
  #
  # Split like a normal build leg: benchmark-build produces one extension per
  # binding mode (static/dynamic) as an artifact, and benchmark consumes both
  # and publishes the comparison report. The two variants share the very same
  # build path as every other leg, so the benchmark can never silently measure
  # a differently-built extension.
  #
  # Exit codes of the bench runs are tolerated: the job judges by the presence
  # of the BENCH_JSON line (jsb teardown can crash after a heavy scene, a known
  # engine-side issue).
  benchmark-build:
    name: Benchmark build (${{ matrix.binding-mode }})
    if: github.event_name == 'workflow_dispatch'
    needs: [environment]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        binding-mode: ["static", "dynamic"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup build dependencies
        uses: ./.github/actions/setup-godotjs-ext
        with:
          platform: linux
          arch: x86_64
          python-version: ${{ env.PYTHON_VERSION }}
          scons-version: ${{ env.SCONS_VERSION }}

      - name: Download JS runtime
        uses: actions/download-artifact@v8
        with:
          name: scripts-out
          path: scripts/out

      - name: Build GDExtension (benchmark variant)
        uses: ./.github/actions/scons-build
        with:
          platform: linux
          arch: x86_64
          target: editor
          engine: v8
          profile: release
          flags: binding_mode=${{ matrix.binding-mode }}
          stage-artifact: "false"

      - name: Stage benchmark binary
        shell: bash
        run: |
          mkdir -p benchmark
          cp project/addons/godotjs-ext.daylily-zeleen/bin/linux/godotjs-ext.linux.editor.x86_64.so \
             benchmark/godotjs-ext.so

      - name: Upload benchmark binary
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.static-binding }}
          path: benchmark/
          retention-days: 1

  benchmark:
    name: Benchmark (static vs dynamic)
    if: github.event_name == 'workflow_dispatch'
    needs: [environment, benchmark-build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: ./.github/actions/pnpm-install
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Download Godot
        uses: ./.github/actions/fetch-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          asset: ${{ env.GODOT_ASSET_LINUX }}

      - name: Download benchmark binaries
        uses: actions/download-artifact@v8
        with:
          path: /tmp/bench
          pattern: benchmark-*

      # Bootstrap emit only: this job never builds the api store, so
      # `project/typings/` cannot be generated here and the emit cannot be
      # type-checked. The benchmark scene only needs runnable JS; the
      # type-checking gate lives in the `test` job ("Generate project typings").
      - name: Build TypeScript (bootstrap emit)
        shell: bash
        run: |
          pnpm install
          pnpm exec tsc --noCheck
        working-directory: project

      - name: Run benchmark (both legs)
        shell: bash
        run: |
          ADDONS_SO=project/addons/godotjs-ext.daylily-zeleen/bin/linux/godotjs-ext.linux.editor.x86_64.so
          mkdir -p project/addons/godotjs-ext.daylily-zeleen/bin/linux
          for leg in static dynamic; do
            if [ "$leg" == "static" ]; then SO=/tmp/bench/benchmark-yes/godotjs-ext.so; else SO=/tmp/bench/benchmark-no/godotjs-ext.so; fi
            cp "$SO" "$ADDONS_SO"
            rm -f /tmp/bench/${leg}.json
            "$GODOT" --audio-driver Dummy --headless --path project -- --bench > /tmp/bench/${leg}.log 2>&1 || true
            grep 'BENCH_JSON ' /tmp/bench/${leg}.log | sed 's/.*BENCH_JSON //' > /tmp/bench/${leg}.json
            test -s /tmp/bench/${leg}.json || { echo "missing BENCH_JSON for $leg leg"; exit 1; }
          done

      - name: Crash diagnosis (gdb backtrace on the teardown SEGV)
        if: always()
        shell: bash
        run: |
          sudo apt-get install -y gdb
          ADDONS_SO=project/addons/godotjs-ext.daylily-zeleen/bin/linux/godotjs-ext.linux.editor.x86_64.so
          cp /tmp/bench/benchmark-yes/godotjs-ext.so "$ADDONS_SO"
          gdb -batch -ex run -ex 'bt 40' --args "$GODOT" --audio-driver Dummy --headless --path project -- --bench \
            > /tmp/bench/gdb_static.log 2>&1 || true
          tail -60 /tmp/bench/gdb_static.log || true

      - name: Comparison report
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json
          def load(p):
              with open(p) as f:
                  return json.load(f)
          a = load("/tmp/bench/static.json")
          b = load("/tmp/bench/dynamic.json")

          # CONSISTENCY GATE: per-case result summaries must match exactly
          # between the two binding paths before any performance number is
          # considered valid. A mismatch fails the job outright.
          mismatches = []
          for ra in a["results"]:
              rb = next((r for r in b["results"] if r["name"] == ra["name"]), None)
              if rb is None or rb.get("error") or ra.get("error"):
                  continue
              if ra.get("sample") != rb.get("sample"):
                  mismatches.append((ra["name"], ra.get("sample"), rb.get("sample")))
          if mismatches:
              print("RESULT MISMATCH static vs dynamic:")
              for n, s_, d_ in mismatches:
                  print(f"  {n}: static={s_} dynamic={d_}")
              raise SystemExit(1)
          print(f"consistency gate passed ({len(a['results'])} cases)")

          rows = []
          for name in {r["name"] for r in a["results"]} | {r["name"] for r in b["results"]}:
              ra = next((r for r in a["results"] if r["name"] == name), None)
              rb = next((r for r in b["results"] if r["name"] == name), None)
              if not ra or not rb or ra.get("error") or rb.get("error"):
                  continue
              rows.append((name, ra["nsPerCall"], rb["nsPerCall"]))
          rows.sort(key=lambda r: r[2] / max(r[1], 1), reverse=True)
          lines = [
              "# Static vs Dynamic binding benchmark (ns/call, lower is better)",
              f"engine: {a['engine']}  |  invalid cases skipped",
              "",
              "## Binary size",
          ]
          import os
          for leg in ("dynamic", "static"):
              sz = os.path.getsize(f"/tmp/bench/benchmark-{'yes' if leg == 'static' else 'no'}/godotjs-ext.so")
              lines.append(f"- {leg} gdextension: {sz / 1024 / 1024:.2f} MiB")
          lines.append("")
          lines += [
              "| case | dynamic | static | ratio (dyn/stat) |",
              "|---|---:|---:|---:|",
          ]
          for name, dyn, stat in rows:
              lines.append(f"| {name} | {dyn} | {stat} | {dyn / max(stat, 0.1):.2f}x |")
          with open("/tmp/bench/report.md", "w") as f:
              f.write("\n".join(lines) + "\n")
          print("\n".join(lines[:40]))
          PYEOF

      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: |
            /tmp/bench/report.md
            /tmp/bench/static.json
            /tmp/bench/dynamic.json
            /tmp/bench/gdb_static.log

  build:
    name: Build (${{ matrix.platform }}, ${{ matrix.arch }}, ${{ matrix.target }}, ${{ matrix.engine }})
    needs: environment
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows toolchain per leg. The v8 and libnode prebuilts are MSVC
          # archives (MSVC-mangled C++ symbols), so they can only be linked by
          # an MSVC-ABI compiler - msvc or clang-cl (llvm). quickjs-ng is a
          # plain C source build and works with MinGW.
          - platform: windows
            os: windows-latest
            arch: x86_64
            target: editor
            engine: v8
            windows-compiler: msvc
          - platform: windows
            os: windows-latest
            arch: x86_64
            target: editor
            engine: qjs-ng
            windows-compiler: mingw
          - platform: linux
            os: ubuntu-22.04
            arch: x86_64
            target: editor
            engine: v8
          - platform: linux
            os: ubuntu-22.04
            arch: x86_64
            target: editor
            engine: qjs-ng
          # Linux arm64 builds (cross-compiled on x86_64 runner with
          # gcc-aarch64-linux-gnu; native arm64 runners are too scarce)
          - platform: linux
            os: ubuntu-22.04
            arch: arm64
            target: editor
            engine: v8
          - platform: linux
            os: ubuntu-22.04
            arch: arm64
            target: editor
            engine: qjs-ng
          # macOS builds.
          # - qjs-ng: universal (single build covers arm64 + x86_64, avoiding
          #   the deprecated/slow macos-13 x86_64 runners)
          # - v8: arm64 only (the v8 prebuilt has no universal variant, see
          #   SConstruct's explicit rejection of macos+universal+v8)
          - platform: macos
            os: macos-latest
            arch: arm64
            target: editor
            engine: v8
          - platform: macos
            os: macos-latest
            arch: universal
            target: editor
            engine: qjs-ng
          # iOS builds (device + simulator -> xcframework)
          - platform: ios
            os: macos-latest
            arch: arm64
            target: template_release
            engine: v8
          - platform: ios
            os: macos-latest
            arch: arm64
            target: template_release
            engine: qjs-ng
          - platform: ios
            os: macos-latest
            arch: arm64
            target: template_release
            engine: jsc
          # Android platform (arm64, x86_64)
          - platform: android
            os: ubuntu-22.04
            arch: arm64
            target: template_release
            engine: v8
          - platform: android
            os: ubuntu-22.04
            arch: arm64
            target: template_release
            engine: qjs-ng
          - platform: android
            os: ubuntu-22.04
            arch: x86_64
            target: template_release
            engine: v8
          - platform: android
            os: ubuntu-22.04
            arch: x86_64
            target: template_release
            engine: qjs-ng
          # Web platform (wasm32) - with threads
          - platform: web
            os: ubuntu-22.04
            arch: wasm32
            target: template_release
            engine: v8
            threads: true
          - platform: web
            os: ubuntu-22.04
            arch: wasm32
            target: template_release
            engine: qjs-ng
            threads: true
          # Web platform (wasm32) - without threads
          - platform: web
            os: ubuntu-22.04
            arch: wasm32
            target: template_release
            engine: v8
            threads: false
          - platform: web
            os: ubuntu-22.04
            arch: wasm32
            target: template_release
            engine: qjs-ng
            threads: false
          # Node engine (libnode embeds V8; the standalone v8 monolith is not
          # linked). All three desktop legs are enabled: the prebuilt libnode
          # archive is built by our own GodotJS-Dependencies workflow, which
          # runs scripts/node/patch_rtti.py on every platform so the Delegate
          # RTTI typeinfo our serialization subclasses need is present (on
          # darwin the patch flips the GCC_ENABLE_CPP_RTTI xcode setting, which
          # gyp's make generator turns into -fno-rtti when it is left at NO).
          - platform: windows
            os: windows-latest
            arch: x86_64
            target: editor
            engine: node
            windows-compiler: msvc
          - platform: linux
            os: ubuntu-22.04
            arch: x86_64
            target: editor
            engine: node
          - platform: macos
            os: macos-latest
            arch: arm64
            target: editor
            engine: node
          # JavaScriptCore engine (macOS, iOS only)
          - platform: macos
            os: macos-latest
            arch: arm64
            target: editor
            engine: jsc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup build dependencies
        uses: ./.github/actions/setup-godotjs-ext
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          # The setup action installs an engine-specific toolchain for the
          # linux x86_64 node leg (gcc-12, which the prebuilt libnode.a needs).
          engine: ${{ matrix.engine }}
          windows-compiler: ${{ matrix.windows-compiler || 'msvc' }}
          python-version: ${{ env.PYTHON_VERSION }}
          scons-version: ${{ env.SCONS_VERSION }}
          mingw-version: ${{ env.MINGW_VERSION }}
          em-version: ${{ env.EM_VERSION }}
          ndk-version: ${{ env.NDK_VERSION }}
          java-version: ${{ env.JAVA_VERSION }}
          java-distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Download JS runtime
        uses: actions/download-artifact@v8
        with:
          name: scripts-out
          path: scripts/out

      # Fast path for dependency iteration: pull the per-platform bundles from a
      # GodotJS-Dependencies run's ci-<run id> release, so a dependency fix can be
      # verified in minutes instead of waiting for the multi-hour full bundle.
      # Release assets are anonymously readable, so this needs no cross-repo
      # token, unlike workflow artifacts.
      - name: Fetch dependencies from a GodotJS-Dependencies run
        if: github.event_name == 'workflow_dispatch' && inputs.deps_run != '' && contains(format(',{0},', inputs.deps_engines || 'v8,node,lws'), format(',{0},', matrix.engine))
        shell: bash
        env:
          DEPS_REPO: Daylily-Zeleen/GodotJS-Dependencies
          # node spells windows x64 the node-native way; v8/lws use x86_64.
          DEPS_PLATFORM: ${{ matrix.platform }}
          DEPS_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          tag="ci-${{ inputs.deps_run }}"
          base="https://github.com/${DEPS_REPO}/releases/download/${tag}"
          plat="${DEPS_PLATFORM}"
          arch_v8="${DEPS_ARCH}"
          arch_node="${DEPS_ARCH}"

          fetch() { # fetch <url> <outfile>
            echo "GET $1"
            # Retry: the releases CDN occasionally drops a connection mid-transfer
            # and these bundles run to hundreds of MB.
            curl -fsSL --retry 4 --retry-delay 5 --retry-all-errors --max-time 1800 \
              -o "$2" "$1"
          }

          want="${DEPS_ENGINES:-v8,node,lws}"
          for component in v8 node lws; do
            case ",${want}," in *",${component},"*) ;; *) continue ;; esac
            case "$component" in
              node) asset="node_${plat}_${arch_node}.zip" ;;
              *)    asset="${component}_${plat}_${arch_v8}.zip" ;;
            esac
            rm -rf ".deps-staging/${component}" && mkdir -p ".deps-staging/${component}"
            if ! fetch "$base/$asset" "/tmp/${component}.zip"; then
              echo "::warning::${asset} is not in ${tag}; ${component} will come from the release"
              rm -rf ".deps-staging/${component}"
              continue
            fi
            mkdir -p "third"
            # component -> third/<dir>, which is also the zip's top-level layout.
            case "$component" in
              v8)  dest="third/v8" ;;
              lws) dest="third/lws" ;;
              node) dest="third/libnode" ;;
            esac
            rm -rf "$dest" && mkdir -p "$dest"
            unzip -q "/tmp/${component}.zip" -d "$dest"
            echo "installed ${component} -> $dest"; find "$dest" -maxdepth 2 | head -10
          done
          # v8 headers are shipped once for all its legs rather than duplicated
          # into every platform bundle.
          if [ -d third/v8 ] && [ ! -f third/v8/include/v8.h ]; then
            if fetch "$base/v8_include.zip" /tmp/v8_include.zip; then
              unzip -q /tmp/v8_include.zip -d third/v8
              echo "installed v8 include tree"
            fi
          fi

      - name: Restore V8 dependency cache
        if: matrix.engine == 'v8'
        uses: actions/cache@v6
        with:
          path: third/v8
          key: v8-dependency-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('SConstruct') }}

      # Cache the extracted libnode tree, not "third/node": download_dependency()
      # installs it under third/libnode (the release asset is node_<ref>.zip but
      # its top-level directory is libnode/).
      - name: Restore Node dependency cache
        if: matrix.engine == 'node'
        uses: actions/cache@v6
        with:
          path: third/libnode
          key: node-dependency-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('SConstruct') }}

      # SCons cache is enabled on non-Windows platforms only. MSVC's debug info
      # lives in a shared PDB that the cached .obj files do not carry, so cache
      # hits produce LNK4099 warnings which fail the build due to /WX.
      # GCC/Clang embed debug info per object file, so their caches are safe.
      - name: Restore SCons cache
        if: matrix.platform != 'windows'
        uses: actions/cache@v6
        with:
          path: .scons-cache
          key: scons-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.engine }}${{ matrix.platform == 'web' && format('-threads-{0}', matrix.threads) || '' }}-${{ hashFiles('SConstruct', 'src/**', 'third/godot-cpp/**') }}
          restore-keys: |
            scons-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.engine }}${{ matrix.platform == 'web' && format('-threads-{0}', matrix.threads) || '' }}-
            scons-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-
            scons-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Build GDExtension
        uses: ./.github/actions/scons-build
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          engine: ${{ matrix.engine }}
          windows-compiler: ${{ matrix.windows-compiler || 'msvc' }}
          threads: ${{ matrix.threads }}
          scons-cache: ${{ matrix.platform != 'windows' && format('{0}/.scons-cache', github.workspace) || '' }}

      - name: Upload GDExtension artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}-${{ matrix.engine }}${{ matrix.platform == 'web' && matrix.threads == false && '-nothreads' || '' }}
          path: artifact/
          retention-days: 1

  # Guard against PARTIAL release zips: misc_release.yml globs '*-v8' /
  # '*-qjs-ng' over this run's artifacts and merges whatever matches. A total
  # mismatch fails loudly at release time, but a partial match (a matrix leg
  # renamed or dropped) would silently ship a zip missing platforms.
  #
  # Expected names are DERIVED from the build matrix above (single source of
  # truth - no second list to maintain). Extra artifacts matching the globs
  # are by-design auto-included into releases and are NOT flagged.
  verify-release-artifacts:
    name: Verify Release Artifact Names
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Diff expected (derived from build matrix) vs actual artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > expected.txt
          import yaml
          wf = yaml.safe_load(open('.github/workflows/ci.yml', encoding='utf-8'))
          legs = wf['jobs']['build']['strategy']['matrix']['include']
          out = []
          for leg in legs:
              eng = leg.get('engine')
              if eng not in ('v8', 'qjs-ng'):
                  continue  # jsc/node are not part of the release merge flow yet
              suffix = '-nothreads' if (leg['platform'] == 'web' and leg.get('threads') is False) else ''
              out.append(f"{leg['platform']}-{leg['target']}-{leg['arch']}-{eng}{suffix}")
          print('\n'.join(sorted(out)))
          PY
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            -q '.artifacts[].name' | sort > actual.txt
          echo "=== expected (derived from build matrix) ==="
          cat expected.txt
          echo "=== actual artifacts of this run ==="
          cat actual.txt
          if ! missing=$(comm -23 expected.txt actual.txt); then exit $?; fi
          if [ -n "$missing" ]; then
            echo "::error::Release merge would silently skip these legs:"
            echo "$missing"
            exit 1
          fi
          echo "All release-matched legs are present."

  test:
    name: Test (${{ matrix.runtime }}, ${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # host-v8 / host-qjs run on Linux (artifacts built natively there)
          # NOTE: env.* is not available in the matrix context, so the asset
          # names are spelled out here; keep them in sync with GODOT_ASSET_*.
          - runtime: host-v8
            os: ubuntu-22.04
            artifact: linux-editor-x86_64-v8
            godot_asset: Godot_v4.7.1-stable_linux.x86_64.zip
          - runtime: host-qjs
            os: ubuntu-22.04
            artifact: linux-editor-x86_64-qjs-ng
            godot_asset: Godot_v4.7.1-stable_linux.x86_64.zip
          # host-node runs on all three desktop platforms: libnode is linked
          # there (see the build matrix), so the runtime leg is available.
          - runtime: host-node
            os: windows-latest
            artifact: windows-editor-x86_64-node
            godot_asset: Godot_v4.7.1-stable_win64.exe.zip
          - runtime: host-node
            os: ubuntu-22.04
            artifact: linux-editor-x86_64-node
            godot_asset: Godot_v4.7.1-stable_linux.x86_64.zip
          - runtime: host-node
            os: macos-latest
            artifact: macos-editor-arm64-node
            godot_asset: Godot_v4.7.1-stable_macos.universal.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: ./.github/actions/pnpm-install
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Build JS runtime
        run: pnpm build
        shell: bash
        working-directory: scripts

      - name: Install gdb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gdb strace

      # A crashing Godot process on Windows can pop up the Windows Error
      # Reporting dialog, which blocks the runner forever. Disable its UI.
      - name: Disable Windows Error Reporting UI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting' -Name DontShowUI -Value 1 -Type DWord

      - name: Download GDExtension artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: runtime-artifacts

      - name: Download Godot
        uses: ./.github/actions/fetch-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          asset: ${{ matrix.godot_asset }}

      - name: Put Godot on PATH
        shell: bash
        run: |
          # run-runtime-matrix resolves the host engine from PATH as `godot`,
          # so expose the fetched binary under that name. Windows resolves
          # `where godot` through PATHEXT, hence the .exe suffix.
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp "$GODOT" "tests/bin/godot.exe"
          elif [ "$RUNNER_OS" == "macOS" ]; then
            # The macOS engine is Godot.app/Contents/MacOS/Godot: the binary must
            # be invoked at its in-bundle path (a copy would lose the bundle, and
            # a bare symlink makes CFBundleGetMainBundle resolve to the link).
            # A wrapper keeps the exec path inside the .app.
            #
            # $GODOT is already an arch-forced launcher on macOS (see
            # fetch-godot): the official engine is a universal binary and Godot
            # grants the "universal" feature on BOTH macOS architectures while
            # granting "arm64" only when the process really is arm64
            # (core/os/os.cpp:529-556). An engine started as x86_64 cannot match
            # the arm64 library keys and looks for "...universal.dylib" - a file
            # the arm64-only v8/node/jsc legs never build. Re-exec through $GODOT
            # so the same arch-forced path is used here too.
            printf '#!/bin/sh\nexec "%s" "$@"\n' "$GODOT" > tests/bin/godot
            chmod +x tests/bin/godot
          else
            cp "$GODOT" "tests/bin/godot"
            chmod +x "tests/bin/godot"
          fi
          echo "$GITHUB_WORKSPACE/tests/bin" >> "$GITHUB_PATH"

      - name: Setup test project
        shell: bash
        run: |
          mkdir -p project/addons/godotjs-ext.daylily-zeleen/bin
          cp -r runtime-artifacts/. project/addons/godotjs-ext.daylily-zeleen/bin/
          # Record what the engine will actually match. If a macOS leg still
          # resolves the arch-less "universal" key while the artifact only
          # contains an arm64 dylib, this makes the cause visible immediately
          # instead of only as a missing-file error.
          if [ "$RUNNER_OS" == "macOS" ]; then
            echo "--- runner arch ---"
            uname -m
            arch
            echo "--- engine launcher ---"
            echo "GODOT=$GODOT"
            file "$GODOT" 2>/dev/null || true
            echo "--- staged macOS libraries ---"
            ls -la project/addons/godotjs-ext.daylily-zeleen/bin/macos/ 2>/dev/null || true
          fi

      # Bootstrap emit ONLY. `project/typings/` does not exist yet — it is
      # generated from the api store that the next step produces — so this pass
      # cannot type-check; it exists to emit the JS the editor loads while
      # generating that data (`noEmitOnError: false` keeps the emit going).
      # Type checking is enforced by the "Generate project typings" step below.

      - name: Build TypeScript test files (bootstrap emit)
        shell: bash
        run: |
          pnpm install
          pnpm exec tsc --noCheck
        working-directory: project

      - name: Generate API data
        timeout-minutes: 15
        shell: bash
        # The C++ unit tests (and api_tool) need the .api_dumping data, which
        # is normally generated by the editor. In a fresh CI checkout it does
        # not exist, so generate it here:
        #   1. dump the extension API (with docs) into project/extension_api.json
        #   2. convert it into project/.godot/.api_dumping/*.capi via the
        #      --godotjs-api-generate extension command.
        # NOTE: On Godot 4.7.1 both steps can crash during editor shutdown/reimport
        # (exit non-zero) even though the data is written correctly before that;
        # tolerate the crash and verify the generated files instead. The C++
        # unit test step below also depends on this data, so a genuinely
        # incomplete generation would fail there.
        run: |
          "$GODOT" --headless --editor --path project --dump-extension-api-with-docs || true
          test -f project/extension_api.json
          # NOTE: the editor may crash during its shutdown phase after the data has
          # been written (Godot 4.7.1 + extension teardown - tracked separately);
          # success is judged by the presence of the generated store below.
          # The first-generation pipeline is non-deterministically hit by a
          # teardown/reimport SIGSEGV (tracked separately). A rerun on wiped
          # caches usually completes cleanly, so retry a few times and only
          # fail when the store is still missing afterwards.
          ok=0
          for attempt in 1 2 3; do
            if "$GODOT" --headless --editor --path project --godotjs-api-generate extension_api.json --quit; then
              ok=1
            fi
            if test -f project/.godot/.api_dumping/header.capi; then
              ok=1
              break
            fi
            echo "attempt $attempt did not produce the api store, wiping caches and retrying..."
            rm -rf project/.godot
            # Bootstrap emit only (typings still absent); see the step above.
            rm -f project/.godot/.tsbuildinfo && pnpm -C project exec tsc --noCheck
            "$GODOT" --headless --editor --path project --dump-extension-api-with-docs || true
            test -f project/extension_api.json
          done
          test -f project/.godot/.api_dumping/header.capi || { echo "api store missing after retries"; exit 1; }

      - name: Generate project typings (type-check enforced)
        shell: bash
        working-directory: project
        # The api store now exists, so `gen:types` can produce `project/typings/`
        # and then run its enforcing `tsc` pass — the test project is genuinely
        # type-checked here. `--generate-types` is known to exit non-zero during
        # the editor's own shutdown after the files are written; the script
        # tolerates that and the trailing type-check is what proves success.
        run: |
          rm -f project/.godot/.tsbuildinfo
          pnpm gen:types

      # Diagnostic: rerun the exact first-time generation scenario under gdb
      # to capture a symbolized backtrace of the teardown SIGSEGV. Never
      # fails the job (continue-on-error), the backtrace lands in the log.
      - name: Debug first-generation teardown crash (diagnostic)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          # Wipe the WHOLE .godot cache dir (not just api_dumping): leftover
          # import caches / runtime install markers from a previous successful
          # generation change the startup+teardown path and mask the crash.
          rm -rf project/.godot
          "$GODOT" --headless --editor --path project --dump-extension-api-with-docs || true
          test -f project/extension_api.json
          gdb -batch -ex run -ex "bt full" --args "$GODOT" --headless --editor --path project --godotjs-api-generate extension_api.json --quit || true
          # The wipe above also removed the compiled JS output (tsc artifacts
          # live under .godot/godotjs_ext); restore them for the test steps.
          # typings/ is unaffected, so this is an enforcing pass.
          rm -f project/.godot/.tsbuildinfo
          pnpm -C project exec tsc

      - name: Run C++ unit tests
        shell: bash
        # C++ unit tests run via --jsb-run-tests and exit on their own;
        # they are independent from the TypeScript integration tests below.
        run: |
          # `timeout(1)` is GNU coreutils and the macOS runner image has no
          # coreutils at all (no timeout, no gtimeout). Fall back to a perl
          # alarm wrapper: perl is present on both Linux and macOS runners.
          run_with_timeout() {
            local secs="$1"; shift
            if command -v timeout >/dev/null 2>&1; then
              timeout "$secs" "$@"
            else
              perl -e 'alarm shift; exec @ARGV' "$secs" "$@"
            fi
          }
          if [ "$RUNNER_OS" == "Windows" ]; then
          # Editor startup flows may wipe compiled JS output; re-emit defensively
          # and log the directory state for diagnostics. typings/ is unaffected,
          # so this is an enforcing pass.
          rm -f project/.godot/.tsbuildinfo
          pnpm -C project exec tsc
          ls project/.godot/godotjs_ext | head -20 || true
            "$GODOT" --headless --path project --jsb-run-tests
          else
            run_with_timeout 120 "$GODOT" --headless --path project --jsb-run-tests
          fi

      - name: Run TypeScript integration tests
        shell: bash
        # The runner spawns the engine synchronously (spawnSync, no timeout of
        # its own). If the engine ever fails to quit - e.g. a startup error that
        # stops start.ts from reaching its `finally { quit() }` - the step would
        # otherwise hang until the 6h job ceiling, which is expensive to
        # diagnose. A normal run takes ~1.5 min.
        timeout-minutes: 10
        run: |
          # Editor startup flows may wipe compiled JS output; re-emit defensively
          # and log the directory state for diagnostics. typings/ is unaffected,
          # so this is an enforcing pass.
          rm -f project/.godot/.tsbuildinfo
          pnpm -C project exec tsc
          ls project/.godot/godotjs_ext | head -20 || true
          node scripts/test/run-runtime-matrix.mts --runtimes ${{ matrix.runtime }} --skip-builds

  changesets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    name: Changesets
    uses: ./.github/workflows/misc_changesets.yml

  # Publishing and asset upload run in separate workflow_run workflows after
  # this CI workflow completes. Keeping them out of this dependency graph means
  # manually rerunning a failed matrix job can complete CI without leaving
  # release jobs permanently skipped in the original run.
  # SCons cache keys embed a hashFiles(...) fingerprint, so every source change
  # creates a NEW cache entry and stale ones accumulate until they exhaust the
  # Actions cache quota (10 GB). Keep only the most recent cache per
  # (OS, platform, engine) combo on the current branch.
  cleanup-caches:
    name: Cleanup Old Caches
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # gh cache list --ref resolves the ref via git, so a checkout is required.
      - uses: actions/checkout@v6

      - name: Delete stale SCons caches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ github.head_ref || github.ref_name }}"
          ids=$(gh cache list --ref "$ref" --key scons- --limit 100 \
            --json id,key,createdAt -q '
              sort_by(.key)
              | group_by(.key | split("-")[0:4] | join("-"))
              | .[]
              | sort_by(.createdAt)
              | reverse
              | .[1:]
              | .[].id
            ')
          if [ -z "$ids" ]; then
            echo "No stale SCons caches to delete (ref=$ref)."
            exit 0
          fi
          for id in $ids; do
            echo "Deleting cache $id"
            gh cache delete "$id"
          done
          echo "Done."
