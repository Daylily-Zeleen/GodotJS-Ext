name: pnpm Install
description: Setup pnpm, install dependencies
inputs:
  pnpm-version:
    description: 'pnpm version'
    type: string
    default: '10.11.0'
  node-version-file:
    description: 'Node version file path'
    type: string
    default: '.node-version'
runs:
  using: composite
  steps:
    - name: 🛫 Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    - name: 🦕❌ Setup node.js
      uses: actions/setup-node@v5
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: "pnpm"
        cache-dependency-path: scripts/pnpm-lock.yaml

    - name: 🛠️ Install dependencies
      run: |
        pnpm install
      shell: bash
      working-directory: scripts
