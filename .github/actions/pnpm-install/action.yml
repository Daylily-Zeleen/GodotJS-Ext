name: pnpm Install
description: Setup pnpm, install dependencies
runs:
  using: composite
  steps:
    - name: 🛫 Setup pnpm
      uses: pnpm/action-setup@v6

    - name: 🦕❌ Setup node.js
      uses: actions/setup-node@v5
      with:
        node-version-file: .node-version
        cache: "pnpm"

    - name: 🛠️ Install dependencies
      run: |
        pnpm install
      shell: bash
      working-directory: scripts
