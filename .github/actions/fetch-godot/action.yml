name: Fetch Godot
description: >-
  Download a Godot release, extract it and export GODOT to $GITHUB_ENV so later
  steps can invoke the engine. Handles the Windows zip quirk (GNU tar in Git
  Bash cannot read zip archives, so Expand-Archive is used there).

inputs:
  version:
    description: Release tag, e.g. tags/4.7.1-stable.
    required: true
  asset:
    description: Release asset file name, e.g. Godot_v4.7.1-stable_linux.x86_64.zip.
    required: true
  target:
    description: Directory to extract the engine into.
    required: false
    default: tests/bin

runs:
  using: composite
  steps:
    - name: Download Godot
      uses: dsaltares/fetch-gh-release-asset@1.1.2
      with:
        repo: godotengine/godot
        version: ${{ inputs.version }}
        file: ${{ inputs.asset }}
        target: godot/godot.zip

    - name: Extract Godot
      shell: bash
      env:
        GODOT_TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        mkdir -p "$GODOT_TARGET"
        if [ "$RUNNER_OS" = "Windows" ]; then
          powershell -NoProfile -Command \
            "Expand-Archive -Path godot/godot.zip -DestinationPath '$GODOT_TARGET' -Force"
        else
          unzip -o godot/godot.zip -d "$GODOT_TARGET/"
          chmod +x "$GODOT_TARGET"/Godot* 2>/dev/null || true
        fi
        GODOT_BIN=$(find "$GODOT_TARGET" -maxdepth 1 -name 'Godot*' -type f | head -1)
        echo "GODOT=$GITHUB_WORKSPACE/$GODOT_BIN" >> "$GITHUB_ENV"
        echo "Using GODOT=$GITHUB_WORKSPACE/$GODOT_BIN"
