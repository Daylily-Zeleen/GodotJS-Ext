name: Fetch Godot
description: >-
  Download a Godot release, extract it and export GODOT to $GITHUB_ENV so later
  steps can invoke the engine. Handles the Windows zip quirk (GNU tar in Git
  Bash cannot read zip archives, so Expand-Archive is used there).

inputs:
  version:
    description: Release tag, e.g. tags/4.7.1-stable.
    required: true
  asset:
    description: Release asset file name, e.g. Godot_v4.7.1-stable_linux.x86_64.zip.
    required: true
  target:
    description: Directory to extract the engine into.
    required: false
    default: tests/bin

runs:
  using: composite
  steps:
    # Plain curl instead of a release-fetch action: the asset is a public
    # release file reachable by tag, and third-party fetch actions are the only
    # Node-20-era dependency left in this workflow (dsaltares/
    # fetch-gh-release-asset@1.1.2 is unmaintained since 2024-04, and the
    # runner forces it onto Node 24 with a deprecation warning).
    - name: Download Godot
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.version }}
        GODOT_ASSET: ${{ inputs.asset }}
      run: |
        set -euo pipefail
        mkdir -p godot
        # `version` is a git ref like tags/4.7.1-stable; the download path uses
        # the bare tag (4.7.1-stable).
        TAG="${GODOT_VERSION#tags/}"
        URL="https://github.com/godotengine/godot/releases/download/$TAG/$GODOT_ASSET"
        echo "Downloading $URL"
        curl -fL --retry 3 --retry-delay 2 -o godot/godot.zip "$URL"

    - name: Extract Godot
      shell: bash
      env:
        GODOT_TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        mkdir -p "$GODOT_TARGET"
        if [ "$RUNNER_OS" = "Windows" ]; then
          powershell -NoProfile -Command \
            "Expand-Archive -Path godot/godot.zip -DestinationPath '$GODOT_TARGET' -Force"
        else
          unzip -o godot/godot.zip -d "$GODOT_TARGET/"
          chmod +x "$GODOT_TARGET"/Godot* 2>/dev/null || true
        fi
        GODOT_BIN=""
        if [ "$RUNNER_OS" = "macOS" ]; then
          # The macOS asset is a Godot.app bundle, not a bare executable, so the
          # engine lives inside Contents/MacOS and the -type f probe below
          # matches nothing.
          GODOT_APP=$(find "$GODOT_TARGET" -maxdepth 1 -name '*.app' -type d | head -1)
          if [ -n "$GODOT_APP" ]; then
            GODOT_BIN="$GODOT_APP/Contents/MacOS/Godot"
          fi
        else
          GODOT_BIN=$(find "$GODOT_TARGET" -maxdepth 1 -name 'Godot*' -type f | head -1)
        fi
        if [ -z "$GODOT_BIN" ] || [ ! -f "$GODOT_BIN" ]; then
          echo "could not locate the extracted Godot engine under $GODOT_TARGET" >&2
          exit 1
        fi
        GODOT_PATH="$GITHUB_WORKSPACE/$GODOT_BIN"
        echo "Using GODOT=$GODOT_PATH"
        echo "GODOT=$GODOT_PATH" >> "$GITHUB_ENV"
        # On macOS also expose an arch-forced launcher as $GODOT. The official
        # engine is a universal binary, and Godot grants the "universal" feature
        # on BOTH macOS architectures while granting "arm64" only when the
        # process really is arm64 (core/os/os.cpp:529-556). An engine started as
        # x86_64 therefore cannot match the arm64 library keys, falls back to the
        # arch-less one, and looks for "...universal.dylib" - a file the
        # arm64-only v8/node/jsc legs never produce. Forcing the native slice
        # keeps every invocation (including the direct "$GODOT" calls) consistent.
        if [ "$RUNNER_OS" = "macOS" ]; then
          # Absolute path: subsequent steps run from different working
          # directories, so a relative $GODOT would not resolve.
          LAUNCHER="$GITHUB_WORKSPACE/$GODOT_TARGET/godot-native"
          printf '#!/bin/sh\nexec arch -arm64 "%s" "$@"\n' "$GODOT_PATH" > "$LAUNCHER"
          chmod +x "$LAUNCHER"
          echo "GODOT=$LAUNCHER" >> "$GITHUB_ENV"
          echo "Using (arch-forced) GODOT=$LAUNCHER"
        fi
